name: Deploy CodeSession Static Web App

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and deploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_API_BASE_URL: https://cloudterm-backend-3.koreacentral.cloudapp.azure.com
          VITE_WS_BASE_URL: wss://cloudterm-backend-3.koreacentral.cloudapp.azure.com
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CLOUDTERM_FRONTEND }}
          action: upload
          app_location: frontend
          api_location: ""
          output_location: dist
