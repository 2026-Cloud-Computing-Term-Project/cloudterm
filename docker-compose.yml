services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudterm-postgres
    environment:
      POSTGRES_DB: cloudterm
      POSTGRES_USER: cloudterm
      POSTGRES_PASSWORD: cloudterm
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudterm -d cloudterm"]
      interval: 10s
      timeout: 5s
      retries: 5

  runner:
    build:
      context: ./runner
    container_name: cloudterm-runner
    environment:
      RUNNER_SANDBOX_IMAGE: ${RUNNER_SANDBOX_IMAGE:-python:3.12-slim}
      RUNNER_SANDBOX_WORKDIR: ${RUNNER_SANDBOX_WORKDIR:-/workspace}
      RUNNER_SANDBOX_MEMORY_LIMIT: ${RUNNER_SANDBOX_MEMORY_LIMIT:-128m}
      RUNNER_SANDBOX_CPU_NANO: ${RUNNER_SANDBOX_CPU_NANO:-500000000}
      RUNNER_SANDBOX_PIDS_LIMIT: ${RUNNER_SANDBOX_PIDS_LIMIT:-64}
      RUNNER_SANDBOX_TMPFS_SIZE: ${RUNNER_SANDBOX_TMPFS_SIZE:-64m}
      RUNNER_SANDBOX_USER: ${RUNNER_SANDBOX_USER:-1000:1000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8001/health\", timeout=2).read()'"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: cloudterm-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://cloudterm:cloudterm@postgres:5432/cloudterm}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      RUNNER_URL: ${RUNNER_URL:-http://runner:8001}
      RUN_TIMEOUT_SECONDS: ${RUN_TIMEOUT_SECONDS:-3}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\", timeout=2).read()'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
