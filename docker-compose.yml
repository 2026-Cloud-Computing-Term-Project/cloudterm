services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudterm-postgres
    environment:
      POSTGRES_DB: cloudterm
      POSTGRES_USER: cloudterm
      POSTGRES_PASSWORD: cloudterm
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudterm -d cloudterm"]
      interval: 10s
      timeout: 5s
      retries: 5

  runner:
    build:
      context: ./runner
    container_name: cloudterm-runner
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8001/health\", timeout=2).read()'"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: cloudterm-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RUNNER_URL: ${RUNNER_URL}
      RUN_TIMEOUT_SECONDS: ${RUN_TIMEOUT_SECONDS}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\", timeout=2).read()'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
