services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudterm-postgres
    environment:
      POSTGRES_DB: cloudterm
      POSTGRES_USER: cloudterm
      POSTGRES_PASSWORD: cloudterm
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudterm -d cloudterm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
